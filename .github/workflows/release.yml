name: Release & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release MSI / EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './laptop-optimizer-tauri/src-tauri -> target'

      - name: Install Frontend Dependencies
        working-directory: ./laptop-optimizer-tauri
        run: pnpm install

      - name: Run Rust tests
        working-directory: ./laptop-optimizer-tauri/src-tauri
        run: cargo test --lib

      - name: Build Tauri Desktop and installers (MSI, NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keeps the build machine's folder names out of the program.
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=${{ runner.temp }}=tmp
        with:
          projectPath: './laptop-optimizer-tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'Laptop Optimizer ${{ github.ref_name }}'
          releaseBody: |
            ## Laptop Optimizer ${{ github.ref_name }}

            **Draft: not tested on Windows yet.** Read PRODUCTION_READINESS_PLAN.md in the repository before publishing.
            These files are **not code-signed**, so Windows SmartScreen may warn. A SHA-256 list is not produced by this workflow yet (planned task U33).

            ### Files
            - `LaptopOptimizer_x64_en-US.msi`: Windows Installer package.
            - `LaptopOptimizer_x64-setup.exe`: setup program (NSIS).

            ### Built from
            Commit `${{ github.sha }}`.
          # A person publishes the draft after checking it.
          releaseDraft: true
          prerelease: false
