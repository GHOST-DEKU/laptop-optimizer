name: Tests
on:
  push:
  pull_request:
jobs:
  rust-windows:
    name: Rust tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './laptop-optimizer-tauri/src-tauri -> target'
      - name: cargo test
        working-directory: ./laptop-optimizer-tauri/src-tauri
        run: cargo test --lib
  page-tests:
    name: Page tests (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 laptop-optimizer-tauri/tests/source_guards.py
      - run: python3 laptop-optimizer-tauri/tests/ui_regression.py
      - run: python3 laptop-optimizer-tauri/tests/site_regression.py
