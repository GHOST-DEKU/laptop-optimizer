[package]
name = "laptop-optimizer-tauri"
version = "1.0.0"
description = "Cybercore Techwear Windows Laptop Optimizer"
authors = ["GHOST-DEKU"]
license = "MIT"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
winreg = "0.52"
