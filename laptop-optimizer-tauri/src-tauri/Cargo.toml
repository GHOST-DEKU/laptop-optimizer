[package]
name = "laptop-optimizer-tauri"
version = "2.5.1"
description = "Cybercore Techwear Windows Laptop Optimizer"
authors = ["GHOST-DEKU"]
license = "MIT"
edition = "2021"

[lib]
name = "app_lib"
# Desktop only. The staticlib and cdylib outputs are for mobile builds, which this app does not have.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
winreg = "0.52"

[profile.release]
strip = true
lto = true
codegen-units = 1
